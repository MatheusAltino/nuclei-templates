id: exposed-env-file

info:
  name: Exposed Environment File (.env)
  author: MatheusAltino
  severity: high
  description: |
    Detecta arquivos .env publicamente acessíveis. Esses arquivos frequentemente 
    contêm credenciais de banco de dados, API keys, tokens e outras informações sensíveis.
  classification:
    cwe-id: CWE-200
    cvss-metrics: CVSS:3.1/AV:N/AC:L/PR:N/UI:N/S:U/C:H/I:N/A:N
    cvss-score: 7.5
  tags: env,exposure,config,credentials,disclosure
  metadata:
    max-request: 1
    verified: true

http:
  - method: GET
    path:
      - "{{BaseURL}}/.env"
      - "{{BaseURL}}/.env.local"
      - "{{BaseURL}}/.env.production"
      - "{{BaseURL}}/.env.backup"

    stop-at-first-match: true
    matchers-condition: and
    matchers:
      - type: word
        part: body
        words:
          - "APP_KEY="
          - "DB_PASSWORD="
          - "AWS_ACCESS_KEY_ID="
          - "SECRET_KEY="
          - "API_KEY="
        condition: or

      - type: status
        status:
          - 200

      - type: word
        part: header
        words:
          - "text/plain"
          - "application/octet-stream"
        condition: or
        negative: false

    extractors:
      - type: regex
        name: sensitive-keys
        part: body
        regex:
          - '(?i)(password|secret|key|token|api[_-]?key)\s*[=:]\s*[^\s]+'
